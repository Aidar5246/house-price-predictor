[project]
name = "house-price-predictor"
version = "0.1.0"
description = "A small machine learning project for house price prediction"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas>=2.2,<4.0",
    "scikit-learn>=1.5,<2.0",
    "matplotlib>=3.9,<4.0",
    "seaborn>=0.13,<1.0",
    "joblib>=1.4,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0",
    "black (>=25.1.0)",
    "flake8>=7.0,<8.0",
    "mypy>=1.13,<2.0",
    "pandas-stubs>=2.2",
    "pre-commit>=4.0,<5.0",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "house_price_predictor", from = "src" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
